services:
  postgres:
    image: timescale/timescaledb-ha:pg15-ts2.15
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '1.0'
    expose:
      - "5432"
    volumes:
      - afrixora_postgres_data:/home/postgres/pgdata/data
    environment:
      - POSTGRES_USER=afrixora
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=afrixora_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - database_api
      - database_monitoring
      - database_backup

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.25'
    expose:
      - "6379"
    volumes:
      - afrixora_redis_data:/data
      - ./infrastructure/docker/redis-start.sh:/usr/local/bin/redis-start.sh:ro
    tmpfs:
      - /run/redis-auth:mode=0755,nosuid,nodev,noexec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", '[ "$$(redis-cli --user afrixora_api ping)" = PONG ]']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - redis_api

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256MB
          cpus: '0.25'
    expose:
      - "1883"
      - "9001"
    volumes:
      - afrixora_mosquitto_data:/mosquitto/data
      - afrixora_mosquitto_log:/mosquitto/log
      - ./infrastructure/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - type: bind
        source: ${MQTT_AUTH_PATH:-./infrastructure/docker/mqtt-auth}
        target: /run/mqtt-auth
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 1883 </dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mqtt_api
      - mqtt_ingress

  api:
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '0.75'
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://afrixora_api:${DB_API_URL_PASSWORD:-${DB_API_PASSWORD}}@postgres:5432/afrixora_prod
      - REDIS_URL=redis://afrixora_api:${REDIS_URL_PASSWORD:-${REDIS_PASSWORD}}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - MQTT_URL=mqtt://mosquitto:1883
      - AFRIXORA_DEVICE_CONTROL_ENABLED=${AFRIXORA_DEVICE_CONTROL_ENABLED:-false}
      - AFRIXORA_AUTOMATION_COMMANDS_ENABLED=${AFRIXORA_AUTOMATION_COMMANDS_ENABLED:-false}
      - MQTT_API_USER=${MQTT_API_USER}
      - MQTT_API_PASSWORD=${MQTT_API_PASSWORD}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM:-}
      - DOMAIN=${DOMAIN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-2}
      - ENERGY_COST_PER_KWH=${ENERGY_COST_PER_KWH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - api_ingress
      - database_api
      - redis_api
      - mqtt_api

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.${DOMAIN}}"
        NEXT_PUBLIC_AFRIXORA_DEVICE_CONTROL_ENABLED: "${NEXT_PUBLIC_AFRIXORA_DEVICE_CONTROL_ENABLED:-false}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.5'
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - frontend_ingress

  postgres-backup:
    build:
      context: ./infrastructure
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    volumes:
      - ${BACKUP_STORAGE_PATH:-./backups}:/backups
      - type: bind
        source: ${BACKUP_CERT_PATH:-./infrastructure/docker/backup-cert.pem}
        target: /run/backup-cert.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      - PGPASSWORD=${DB_BACKUP_PASSWORD}
      - PGUSER=afrixora_backup
      - PGHOST=postgres
      - PGDATABASE=afrixora_prod
      - TZ=Africa/Lubumbashi
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "--check"]
      interval: 1m
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database_backup

  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    expose:
      - "80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infrastructure/docker/traefik:/etc/traefik/dynamic:ro
    command:
      - "--api.insecure=false"
      - "--providers.file.filename=/etc/traefik/dynamic/routes.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedheaders.trustedips=${TUNNEL_INGRESS_SUBNET:-10.253.247.0/29}"
      - "--log.level=INFO"
    networks:
      - tunnel_ingress
      - api_ingress
      - frontend_ingress
      - monitoring_ingress

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.11.0}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - traefik
    networks:
      - tunnel_ingress
      - tunnel_egress
      - mqtt_ingress

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.1}
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - afrixora_grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - DB_GRAFANA_PASSWORD=${DB_GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      - postgres
    networks:
      - monitoring_ingress
      - database_monitoring

volumes:
  afrixora_postgres_data:
  afrixora_redis_data:
  afrixora_mosquitto_data:
  afrixora_mosquitto_log:
  afrixora_grafana_data:

networks:
  tunnel_ingress:
    internal: true
    ipam:
      config:
        - subnet: ${TUNNEL_INGRESS_SUBNET:-10.253.247.0/29}
  tunnel_egress:
  api_ingress:
  frontend_ingress:
    internal: true
  monitoring_ingress:
  database_api:
    internal: true
  database_monitoring:
    internal: true
  database_backup:
    internal: true
  redis_api:
    internal: true
  mqtt_api:
    internal: true
  mqtt_ingress:
    internal: true
