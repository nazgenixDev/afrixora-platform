# AFRIXORA MQTT Broker Configuration
# This configuration enables both TCP (1883) and WebSockets (9001) listeners
# WebSockets is required for remote gateways via Cloudflare Tunnel

# TCP listener for internal Docker network only
listener 1883
protocol mqtt

# WebSockets listener for remote gateways via Cloudflare Tunnel
listener 9001
protocol websockets

# Security settings
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_timestamp true
log_type all

# Connection settings
connection_messages true
max_connections 1000
max_queued_messages 1000
max_inflight_messages 100

# Performance settings
max_keepalive 60
set_tcp_nodelay true