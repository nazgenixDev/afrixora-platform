http:
  routers:
    api:
      rule: 'Host(`api.{{ env "DOMAIN" }}`)'
      service: api
    frontend:
      rule: 'Host(`{{ env "DOMAIN" }}`)'
      service: frontend
    grafana:
      rule: 'Host(`grafana.{{ env "DOMAIN" }}`)'
      service: grafana
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:4000
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
