# Grafana datasource configuration for TimescaleDB
apiVersion: 1

# List of datasources to insert/update
datasources:
  # TimescaleDB datasource
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: postgres:5432
    user: afrixora
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      database: afrixora_prod
      sslmode: disable
      timescaledb: true
      postgresVersion: 1500
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
      timeInterval: "1m"
    editable: false
    isDefault: true