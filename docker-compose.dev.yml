services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - development

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - development

  mosquitto:
    ports:
      - "127.0.0.1:1883:1883"
    networks:
      - development

  grafana:
    ports:
      - "127.0.0.1:3001:3000"

  api:
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend/src:/app/src

  frontend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src

networks:
  development:
