services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mosquitto:
    ports:
      - "1883:1883"

  api:
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend/src:/app/src

  frontend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src
