name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: afrixora_test
          POSTGRES_PASSWORD: afrixora_test
          POSTGRES_DB: afrixora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrixora_test -d afrixora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://afrixora_test:afrixora_test@127.0.0.1:5432/afrixora_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer les dépendances
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Générer le client Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Vérifier les types
        run: |
          npm run typecheck --prefix backend
          npm run typecheck --prefix frontend

      - name: Exécuter ESLint
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend

      - name: Compiler
        run: |
          npm run build --prefix backend
          npm run build --prefix frontend

      - name: Exécuter les tests backend
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm test

      - name: Rechercher les secrets dans les fichiers suivis
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          token_patterns='(A[K]IA|A[S]IA)[A-Z0-9]{16}|g[h][pousr]_[[:alnum:]_]{30,}|github[_]pat_[[:alnum:]_]{30,}|x[o]x[baprs]-[[:alnum:]-]{10,}|(afrx|nxa)[_]live_[[:xdigit:]]{32,}'
          key_patterns='-----BEGIN (ENCRYPTED |RSA |EC |OPENSSH |DSA |PGP )?PRIVATE [K]EY( BLOCK)?-----'
          status=0
          git grep -I -l -E -e "$token_patterns|$key_patterns" -- . || status=$?
          case "$status" in
            0)
              echo "::error::Secrets potentiels dans les fichiers listés ci-dessus."
              exit 1
              ;;
            1) exit 0 ;;
            *) exit "$status" ;;
          esac
